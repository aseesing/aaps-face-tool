<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>facetool</title>
<style>
  :root { --bg: #16181c; --panel: #1f2228; --line: #343a45; --text: #e6e8ec; --dim: #98a0ad; --accent: #4fb3ff; --warn: #ffb347; --error: #ff6b6b; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.4 -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: grid; grid-template-rows: auto 1fr 220px; }
  header { display: flex; gap: 10px; align-items: center; padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0 10px 0 0; }
  #server { margin-left: auto; color: var(--dim); }
  #generated { color: var(--warn); }
  button, select, input, textarea { font: inherit; color: var(--text); background: #2a2e36; border: 1px solid var(--line); border-radius: 4px; padding: 3px 8px; }
  button { cursor: pointer; }
  button.on { border-color: var(--accent); color: var(--accent); }
  main { display: grid; grid-template-columns: 290px 1fr 340px; min-height: 0; }
  section { min-height: 0; overflow: auto; border-right: 1px solid var(--line); padding: 8px; }
  h2 { font-size: 12px; text-transform: uppercase; color: var(--dim); margin: 4px 0 6px; }
  #layers div.row { display: flex; gap: 6px; padding: 2px 4px; border-radius: 3px; cursor: pointer; white-space: nowrap; }
  #layers div.row:hover { background: #2a2e36; }
  #layers div.row.selected { background: #2d4460; }
  #layers div.row.changed { box-shadow: inset 3px 0 0 var(--warn); }
  #layers .eye { width: 16px; color: var(--dim); }
  #layers .hidden { opacity: 0.45; }
  #layers .id { width: 34px; color: var(--accent); }
  #preview { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  #tabs, #tools { display: flex; gap: 6px; flex-wrap: wrap; }
  #face { max-width: 100%; max-height: calc(100vh - 420px); min-height: 200px; image-rendering: auto; background: #000; border-radius: 6px; }
  #face.pick { cursor: crosshair; }
  #wakeRow { display: flex; gap: 8px; align-items: center; width: 100%; max-width: 560px; }
  #wakeRow input[type=range] { flex: 1; }
  #note { color: var(--warn); min-height: 1.4em; text-align: center; white-space: pre-wrap; }
  textarea { width: 100%; height: 190px; font: 12px/1.35 ui-monospace, Menlo, monospace; }
  #scene label { display: grid; grid-template-columns: 110px 1fr; gap: 6px; margin: 2px 0; align-items: center; color: var(--dim); }
  footer { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); min-height: 0; }
  footer > div { overflow: auto; padding: 6px 8px; border-right: 1px solid var(--line); }
  #lint div, #log div { font: 12px/1.35 ui-monospace, Menlo, monospace; white-space: pre-wrap; padding: 1px 0; }
  #lint div { cursor: pointer; }
  .error { color: var(--error); } .warning { color: var(--warn); } .info { color: var(--dim); }
  #log .cmd { color: var(--accent); }
  #projectAsk { padding: 30px; }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; min-width: 460px; max-width: 720px; max-height: 80vh; overflow: auto; }
  dialog::backdrop { background: rgba(0, 0, 0, 0.55); }
  dialog h3 { margin: 12px 0 4px; font-size: 13px; color: var(--dim); }
  dialog .place { display: flex; gap: 8px; align-items: center; padding: 3px 0; }
  dialog .place .what { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  dialog .place .where { color: var(--dim); font-size: 12px; }
  dialog .message { color: var(--warn); min-height: 1.4em; white-space: pre-wrap; margin-top: 8px; }
  dialog .bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  #busy { display: none; align-items: center; gap: 6px; color: var(--accent); }
  #busy.on { display: flex; }
  .spinner { width: 12px; height: 12px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #cover { position: fixed; inset: 0; background: rgba(22, 24, 28, 0.88); z-index: 20; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; font-size: 18px; text-align: center; padding: 30px; }
  #cover.on { display: flex; }
  #cover .spinner { width: 34px; height: 34px; border-width: 4px; }
  #cover.gone { color: var(--error); }
  #cover.gone .spinner { display: none; }
  #coverMore { font-size: 13px; color: var(--dim); white-space: pre-wrap; max-width: 640px; }
  #toast { position: fixed; right: 14px; bottom: 14px; max-width: 520px; background: #2d4460; border: 1px solid var(--accent); border-radius: 6px; padding: 8px 12px; white-space: pre-wrap; z-index: 25; display: none; }
  body.dropping::after { content: "Drop the design zip to open it"; position: fixed; inset: 12px; border: 3px dashed var(--accent); border-radius: 12px; background: rgba(22, 24, 28, 0.85); display: flex; align-items: center; justify-content: center; font-size: 22px; z-index: 30; pointer-events: none; }
</style>
</head>
<body>
<header>
  <h1 id="name">facetool</h1>
  <button id="open">Open</button>
  <button id="new">New</button>
  <button id="save" title="facetool save">Save</button>
  <button id="undo" title="facetool undo">Undo</button>
  <button id="redo" title="facetool redo">Redo</button>
  <span id="busy" title="The server is working. You can go on: a change waits for its turn, and the picture shows the newest state."><span class="spinner"></span><span id="busyText"></span></span>
  <span id="generated"></span>
  <span id="server"></span>
</header>
<main>
  <section>
    <h2>Layers and views</h2>
    <div id="layers"></div>
  </section>
  <section id="preview">
    <div id="tabs"><button class="on" data-tab="engine">Engine</button> <button data-tab="wff4">WFF 4</button> <button data-tab="wff2">WFF 2</button> <button data-tab="compare">Side by side</button> <button data-tab="diff">Diff</button> <button data-tab="parts">Parts</button></div>
    <img id="face" alt="the face">
    <div id="wakeRow">wake <input id="wake" type="range" min="0" max="6" step="0.1" value="0"> <span id="wakeValue">rest</span> <button id="play">Play</button> <button id="rest">Rest</button></div>
    <div id="tools"><button id="annotate">annotate</button> <button id="grid">grid</button> <button id="pick">pick</button> <button id="sheet" title="facetool wake --sheet">wake sheet</button> <button id="ambient" title="WFF tabs only">always-on</button></div>
    <div id="note"></div>
  </section>
  <section>
    <h2>Inspector <span id="path"></span></h2>
    <textarea id="json" spellcheck="false"></textarea>
    <div style="margin: 6px 0"><button id="apply">Apply</button> <button id="expanded">Expanded</button></div>
    <h2>Scene</h2>
    <div id="scene"></div>
  </section>
</main>
<footer>
  <div><h2>Lint <button id="lintRun">Run</button> <select id="lintSource"><option value="">all</option><option>engine</option><option>editor</option><option>wff4</option><option>wff2</option><option>player</option></select></h2><div id="lint"></div></div>
  <div><h2>Command log</h2><div id="log"></div></div>
</footer>
<div id="cover"><div class="spinner"></div><div id="coverText"></div><div id="coverMore"></div></div>
<div id="toast" title="Click to hide this message"></div>
<dialog id="openDialog">
  <div class="bar"><b>Open a design</b> <button id="openClose">Close</button></div>
  <div class="info">You can also drop a design zip anywhere on this page.</div>
  <h3>Projects you opened before</h3>
  <div id="openRecent"></div>
  <h3>Design zips</h3>
  <div id="openDesigns"></div>
  <div class="info" id="openRoot"></div>
  <div class="message" id="openMessage"></div>
</dialog>
<dialog id="newDialog">
  <div class="bar"><b>New design</b> <button id="newClose">Close</button></div>
  <p><label>Name <input id="newName" size="32" placeholder="My Face"></label> <button id="newMake">Make it</button></p>
  <div class="info" id="newWhere"></div>
  <div class="message" id="newMessage"></div>
</dialog>
<script>
// The page of the face editor (design section 10). Every action is one command of the command table,
// sent to POST /api/run. The page holds no design of its own: it always shows the project folder.
const query = new URLSearchParams(location.search);
const token = query.get('token');
let project = query.get('project');
const state = { selected: null, hidden: new Set(), annotate: false, grid: false, pick: false, ambient: false, wake: null, summaries: {}, findings: [], tab: 'engine', playing: null };
const $ = id => document.getElementById(id);

// The busy sign: every request that waits for the server is listed in the top bar.
const waiting = new Set();
let waitingEdits = 0;
function showBusy() {
  const now = Date.now();
  const names = [...waiting].map(entry => entry.command + (now - entry.since > 1500 ? ' ' + Math.round((now - entry.since) / 1000) + ' s' : ''));
  $('busy').classList.toggle('on', waiting.size + waitingEdits > 0);
  $('busyText').textContent = 'Working' + (names.length ? ': ' + names.join(', ') : '') + (waitingEdits > 0 ? ' (' + waitingEdits + ' waiting)' : '');
}
setInterval(showBusy, 500);

// The cover over the page: while the first picture is made, and when the server is gone. The controls are off under it.
let serverIsGone = false;
function cover(text, more = '', gone = false) {
  $('coverText').textContent = text; $('coverMore').textContent = more;
  $('cover').classList.add('on'); $('cover').classList.toggle('gone', gone);
  document.querySelectorAll('header, main, footer').forEach(part => { part.inert = true; });
}
function uncover() {
  if (serverIsGone) return;
  $('cover').classList.remove('on');
  document.querySelectorAll('header, main, footer').forEach(part => { part.inert = false; });
}
function serverGone() {
  serverIsGone = true;
  document.querySelectorAll('dialog[open]').forEach(dialog => dialog.close());
  cover('The editor server has stopped.', 'Start it again in a terminal with:  facetool gui\nThat opens a new page. This page cannot go on: a new server has a new address.', true);
}

// Runs one command of the command table in the server. A command without a project (open, new) gives inProject false.
async function run(command, args = {}, inProject = true) {
  const entry = { command, since: Date.now() };
  waiting.add(entry); showBusy();
  try {
    const response = await fetch('/api/run', { method: 'POST', headers: { 'X-Facetool-Token': token, 'Content-Type': 'application/json' }, body: JSON.stringify(inProject ? { command, args, project } : { command, args }) });
    const answer = await response.json();
    if (answer.error) note(answer.text || answer.error);
    return answer;
  } catch (error) {
    // No answer at all: the server is gone (a server that works always answers, also with an error)
    serverGone();
    return { error: 'no server', text: 'The editor server has stopped.' };
  } finally {
    waiting.delete(entry); showBusy();
  }
}
// A change of the project (set, undo, save, the scene): one at a time, in the order of the clicks. None is lost.
let editChain = Promise.resolve();
function edit(command, args = {}) {
  waitingEdits++; showBusy();
  const result = editChain.then(() => { waitingEdits--; return run(command, args); });
  editChain = result.catch(() => {});
  return result;
}
function note(text) { $('note').textContent = text || ''; }
// A message that stays for some seconds, also when the next picture changes the note under the face.
let toastTimer = null;
function toast(text, seconds = 12) {
  $('toast').textContent = text;
  $('toast').style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $('toast').style.display = 'none'; }, seconds * 1000);
}
function fileUrl(path) { return '/api/file?path=' + encodeURIComponent(path) + '&token=' + token + '&t=' + Date.now(); }
function logLine(line, text, exitCode) {
  const row = document.createElement('div');
  row.innerHTML = '<span class="cmd"></span>';
  row.firstChild.textContent = line;
  if (exitCode) row.append(' (exit ' + exitCode + ')');
  $('log').prepend(row);
}

// Open and New (design section 10). The page never unpacks a zip over a project folder that is there
// already: it shows that project with its edits, or unpacks a second copy under a new name.
let places = { root: '', designs: [], recent: [] };
function switchTo(dir, message) {
  try { if (message) sessionStorage.setItem('facetoolNote', message); } catch (error) { /* no storage: no message */ }
  location.search = '?token=' + encodeURIComponent(token) + '&project=' + encodeURIComponent(dir);
}
function placeRow(what, where, buttons) {
  const row = document.createElement('div'); row.className = 'place';
  const text = document.createElement('span'); text.className = 'what'; text.textContent = what;
  if (where) { const small = document.createElement('span'); small.className = 'where'; small.textContent = '  ' + where; text.append(small); text.title = where; }
  row.append(text);
  for (const [label, title, action] of buttons) {
    const button = document.createElement('button'); button.textContent = label; button.title = title; button.onclick = action;
    row.append(button);
  }
  return row;
}
async function unpack(zip, dir, message) {
  message.textContent = 'Unpacking ' + zip + ' ...';
  const answer = await run('open', { zip, dir }, false);
  if (answer.error) message.textContent = answer.text; else switchTo(answer.dir, answer.text);
}
async function showOpen() {
  const message = $('openMessage');
  message.textContent = '';
  $('openDialog').showModal();
  try {
    places = await (await fetch('/api/projects', { headers: { 'X-Facetool-Token': token } })).json();
  } catch (error) { message.textContent = 'The server does not answer.'; return; }
  const recent = $('openRecent'), designs = $('openDesigns');
  recent.textContent = ''; designs.textContent = '';
  for (const entry of places.recent) recent.append(placeRow(entry.name, entry.dir, [['Open', 'Show this project folder', () => switchTo(entry.dir)]]));
  if (!places.recent.length) recent.textContent = 'None yet.';
  for (const place of places.designs) {
    designs.append(placeRow(place.name, place.project ? 'has a project folder with your edits' : '', place.project
      ? [['Continue', 'Show the project folder ' + place.dir + ' as it is. Nothing is unpacked.', () => switchTo(place.dir)],
         ['New copy', 'Unpack the zip again into the new folder ' + place.freeDir + '. Your edits in ' + place.dir + ' stay.', () => unpack(place.zip, place.freeDir, message)]]
      : [['Open', 'Unpack ' + place.zip + ' into ' + place.dir, () => unpack(place.zip, place.dir, message)]]));
  }
  if (!places.designs.length) designs.textContent = 'No design zips found. Set designsDir in local.properties, or drop a zip on this page.';
  $('openRoot').textContent = 'A design is unpacked into ' + places.root + '/<name>.';
}
// A zip dropped on the page: the browser gives no path, so the bytes go to the server, which keeps the zip first.
async function openDropped(file) {
  note('Sending ' + file.name + ' ...');
  let place;
  try {
    place = await (await fetch('/api/upload?name=' + encodeURIComponent(file.name), { method: 'POST', headers: { 'X-Facetool-Token': token }, body: file })).json();
  } catch (error) { return dropMessage('The server does not answer.'); }
  if (place.error) return dropMessage(place.text);
  if (place.project) return switchTo(place.dir, file.name + ' is open already: this is its project folder with your edits. Nothing was unpacked.');
  const answer = await run('open', { zip: place.zip, dir: place.dir }, false);
  if (answer.error) dropMessage(answer.text); else switchTo(answer.dir, 'Kept the dropped zip as ' + place.zip + '.\n' + answer.text);
}
function dropMessage(text) { note(''); if ($('openDialog').open) $('openMessage').textContent = text; else toast(text, 20); }
function fileName(name) { return name.trim().replace(/[^A-Za-z0-9_-]+/g, '_').replace(/^_+|_+$/g, ''); }
async function showNew() {
  $('newMessage').textContent = '';
  $('newDialog').showModal();
  try { places = await (await fetch('/api/projects', { headers: { 'X-Facetool-Token': token } })).json(); } catch (error) { $('newMessage').textContent = 'The server does not answer.'; }
  showNewWhere();
  $('newName').focus();
}
function showNewWhere() { const name = fileName($('newName').value); $('newWhere').textContent = name ? 'It is made in ' + places.root + '/' + name : 'Give the design a name.'; }
async function makeNew() {
  const name = $('newName').value.trim(), folder = fileName(name);
  if (!folder) { $('newMessage').textContent = 'The name needs a letter or a digit.'; return; }
  const answer = await run('new', { name, dir: places.root + '/' + folder }, false);
  if (answer.error) $('newMessage').textContent = /is not empty/.test(answer.text) ? 'There is a folder ' + places.root + '/' + folder + ' already. Choose another name, or open that project with Open.' : answer.text;
  else switchTo(answer.dir, answer.text);
}

async function loadInfo() {
  const info = await run('info');
  if (info.error) return;
  $('name').textContent = info.name || info.dir;
  $('generated').textContent = info.generated ? '! generated: a new build of the designs overwrites this zip' : '';
  if (info.wakeMs) $('wake').max = info.wakeMs / 1000;
  const status = await run('status');
  $('server').textContent = 'server: AAPS ' + String(status.aapsCommit || '').slice(0, 10) + (status.pinned ? ' (pinned)' : ' (NOT the tested commit)') + (status.restartNeeded ? ' restart needed' : '');
}

async function loadLayers(mark) {
  const layers = (await run('list', { kind: 'layers' })).items || [];
  const views = (await run('list', { kind: 'views' })).items || [];
  const box = $('layers');
  box.textContent = '';
  const before = state.summaries;
  state.summaries = {};
  const add = (id, path, summary, hideName) => {
    state.summaries[path] = summary;
    const row = document.createElement('div');
    row.className = 'row' + (state.selected === path ? ' selected' : '') + (state.hidden.has(hideName) ? ' hidden' : '') + (mark && before[path] !== undefined && before[path] !== summary ? ' changed' : '');
    const eye = document.createElement('span'); eye.className = 'eye'; eye.textContent = state.hidden.has(hideName) ? '-' : 'o'; eye.title = 'hide in the preview only';
    eye.onclick = event => { event.stopPropagation(); state.hidden.has(hideName) ? state.hidden.delete(hideName) : state.hidden.add(hideName); loadLayers(); render(); };
    const name = document.createElement('span'); name.className = 'id'; name.textContent = id;
    const text = document.createElement('span'); text.textContent = summary;
    row.append(eye, name, text);
    row.onclick = () => select(path);
    box.append(row);
  };
  for (const layer of layers) add('L' + layer.index, layer.path, layer.summary, String(layer.index));
  for (const view of views) add('view', view.path || view.name, (view.name || view.path) + ' ' + (view.summary || ''), view.name || view.path);
}

async function select(path) {
  state.selected = path;
  $('path').textContent = path;
  const shown = await run('show', { path });
  $('json').value = shown.error ? '' : shown.text;
  $('json').readOnly = false;
  document.querySelectorAll('#layers .row').forEach(row => row.classList.remove('selected'));
  loadLayers();
}

// The WFF tabs: the player's face. The slider is then the seconds since the screen came on.
async function renderWff() {
  note('building the WFF face ...');
  let answer;
  if (state.tab === 'compare') answer = await run('wff compare');
  else if (state.tab === 'diff') answer = await run('diff', { a: 'history:0', b: project, render: true });
  else if (state.tab === 'parts') answer = await run('wff parts');
  else answer = await run('wff render', { version: state.tab === 'wff2' ? '2' : '4', set: ['visibleSec=' + (state.wake === null ? 3600 : state.wake), 'ambient=' + state.ambient] });
  if (answer.error) return;
  const file = answer.file || (answer.statics || [])[0];
  if (file) await showPicture(file);
  note(state.tab === 'compare' || state.tab === 'parts' || state.tab === 'diff' ? answer.text : (answer.problems || []).join('\n'));
}

// A picture: only one is made at a time. A request that comes while one is made does not start a second
// one on top; when the first is done, one more picture is made for the newest state. The latest scene wins.
let renderBusy = null, renderAgain = false;
function render() {
  if (renderBusy) { renderAgain = true; return renderBusy; }
  renderBusy = (async () => {
    try { do { renderAgain = false; await renderNow(); } while (renderAgain); } finally { renderBusy = null; }
  })();
  return renderBusy;
}
// Sets the picture and waits until the browser shows it.
function showPicture(file) {
  return new Promise(done => {
    const face = $('face');
    face.onload = face.onerror = () => { face.onload = face.onerror = null; done(); };
    face.src = fileUrl(file);
  });
}
async function renderNow() {
  if (state.tab !== 'engine') return renderWff();
  const args = {};
  if (state.wake !== null) args.wake = state.wake;
  if (state.hidden.size) args.hide = [...state.hidden].join(',');
  if (state.annotate) args.annotate = true;
  if (state.grid) args.grid = true;
  const answer = await run('render', args);
  if (answer.file) { await showPicture(answer.file); note((answer.warnings || []).join('\n')); }
}

async function loadScene() {
  const scene = (await run('scene')).scene || {};
  const options = (await run('list', { kind: 'options' })).items || [];
  const box = $('scene');
  box.textContent = '';
  const field = (label, key, value) => {
    const row = document.createElement('label');
    const input = document.createElement('input');
    input.value = value === null || value === undefined ? '' : (typeof value === 'object' ? JSON.stringify(value) : value);
    input.onchange = async () => { await edit('scene', { set: [key + '=' + (input.value === '' ? 'null' : input.value)] }); render(); };
    row.append(label, input);
    box.append(row);
  };
  for (const key of ['time', 'sgv', 'delta', 'direction', 'readingAgeMin', 'units', 'iob', 'cob', 'weather', 'temperature', 'phoneBattery', 'watchBattery', 'heartRate', 'steps', 'graph', 'size']) field(key, key, scene[key]);
  for (const option of options) field('option ' + option.name, 'options.' + option.name, (scene.options || {})[option.name]);
  field('colour 1', 'colours.colour1', (scene.colours || {}).colour1);
  field('colour 2', 'colours.colour2', (scene.colours || {}).colour2);
  const hint = document.createElement('div'); hint.className = 'info';
  hint.textContent = 'always-on is for the WFF tabs: the engine preview has no always-on picture. Tilt, tap and the glide wait for the motion model of the converter.';
  box.append(hint);
}

async function lint() {
  $('lint').textContent = 'running the lint ...';
  const answer = await run('lint');
  state.findings = answer.findings || [];
  showLint();
}
function showLint() {
  const source = $('lintSource').value;
  const box = $('lint');
  box.textContent = '';
  const shown = state.findings.filter(f => !source || f.source === source);
  if (!shown.length) box.textContent = 'No findings.';
  for (const finding of shown) {
    const row = document.createElement('div');
    row.className = finding.severity;
    row.textContent = (finding.severity === 'error' ? '!! ' : finding.severity === 'warning' ? '! ' : '') + '[' + finding.source + '] ' + (finding.path || '-') + ': ' + finding.text;
    const layer = /^(animation\.layers\[\d+\])/.exec(finding.path || '');
    row.onclick = () => { if (layer) select(layer[1]); else if (finding.path && state.summaries[finding.path] !== undefined) select(finding.path); };
    box.append(row);
  }
}

// Reads the project again and draws it. One at a time, as render(): the newest state wins.
let refreshBusy = null, refreshAgain = false, refreshMark = false;
function refresh(mark) {
  refreshMark = refreshMark || mark;
  if (refreshBusy) { refreshAgain = true; return refreshBusy; }
  refreshBusy = (async () => {
    try {
      do { refreshAgain = false; const marked = refreshMark; refreshMark = false; await loadInfo(); await loadLayers(marked); await loadScene(); await render(); } while (refreshAgain);
    } finally { refreshBusy = null; }
  })();
  return refreshBusy;
}

$('toast').onclick = () => { $('toast').style.display = 'none'; };
$('open').onclick = showOpen;
$('openClose').onclick = () => $('openDialog').close();
$('new').onclick = showNew;
$('newClose').onclick = () => $('newDialog').close();
$('newName').oninput = showNewWhere;
$('newName').onkeydown = event => { if (event.key === 'Enter') makeNew(); };
$('newMake').onclick = makeNew;
let dragDepth = 0;
const hasFiles = event => [...(event.dataTransfer ? event.dataTransfer.types : [])].includes('Files');
document.addEventListener('dragenter', event => { if (hasFiles(event)) { event.preventDefault(); dragDepth++; document.body.classList.add('dropping'); } });
document.addEventListener('dragover', event => { if (hasFiles(event)) event.preventDefault(); });
document.addEventListener('dragleave', event => { if (hasFiles(event) && --dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dropping'); } });
document.addEventListener('drop', event => {
  if (!hasFiles(event)) return;
  event.preventDefault();
  dragDepth = 0; document.body.classList.remove('dropping');
  const file = event.dataTransfer.files[0];
  if (file) openDropped(file);
});
$('save').onclick = async () => { const answer = await edit('save'); note(answer.text); };
$('undo').onclick = async () => { await edit('undo'); refresh(true); };
$('redo').onclick = async () => { await edit('redo'); refresh(true); };
$('apply').onclick = async () => {
  if (!state.selected) return note('Select a layer or a view first.');
  let value;
  try { value = JSON.parse($('json').value); } catch (error) { return note('The inspector does not hold JSON: ' + error.message); }
  const answer = await edit('set', { path: state.selected, value });
  if (!answer.error) { note(''); await loadLayers(true); render(); }
};
$('expanded').onclick = async () => {
  if (!state.selected || !state.selected.startsWith('animation.layers[')) return note('Expanded works on a layer of animation.layers.');
  const answer = await run('expand', { path: state.selected });
  if (!answer.error) { $('json').value = answer.text; $('json').readOnly = true; note('The expanded form is read only. Select the layer again to edit it.'); }
};
document.querySelectorAll('#tabs button').forEach(button => button.onclick = () => {
  state.tab = button.dataset.tab;
  document.querySelectorAll('#tabs button').forEach(other => other.classList.toggle('on', other === button));
  render();
});
$('ambient').onclick = () => { state.ambient = !state.ambient; $('ambient').classList.toggle('on', state.ambient); render(); };
for (const key of ['annotate', 'grid', 'pick']) $(key).onclick = () => { state[key] = !state[key]; $(key).classList.toggle('on', state[key]); if (key === 'pick') $('face').classList.toggle('pick', state.pick); else render(); };
$('face').onclick = async event => {
  if (!state.pick) return;
  const box = $('face').getBoundingClientRect();
  const x = Math.round((event.clientX - box.left) / box.width * 400), y = Math.round((event.clientY - box.top) / box.height * 400);
  const args = { x, y };
  if (state.wake !== null) args.wake = state.wake;
  const answer = await run('pick', args);
  note('pick ' + x + ', ' + y + ':\n' + (answer.text || ''));
  const top = (answer.hits || [])[0];
  if (top) select(top.path);
};
let wakeTimer = null;
$('wake').oninput = () => {
  state.wake = Number($('wake').value);
  $('wakeValue').textContent = state.wake.toFixed(1) + ' s';
  clearTimeout(wakeTimer);
  wakeTimer = setTimeout(render, 80);
};
$('rest').onclick = () => { state.wake = null; $('wakeValue').textContent = 'rest'; render(); };
$('play').onclick = async () => {
  if (state.playing) { state.playing = null; $('play').textContent = 'Play'; return; }
  const run_ = state.playing = {};
  $('play').textContent = 'Stop';
  const end = Number($('wake').max);
  for (let t = 0; t <= end && state.playing === run_; t += 0.25) {
    state.wake = t; $('wake').value = t; $('wakeValue').textContent = t.toFixed(1) + ' s';
    await render();
  }
  state.playing = null; $('play').textContent = 'Play';
};
$('sheet').onclick = async () => { const answer = await run('wake', { sheet: true, fps: 4 }); if (answer.file) { $('face').src = fileUrl(answer.file); note(answer.text); } };
$('lintRun').onclick = lint;
$('lintSource').onchange = showLint;

function start() {
  if (!token) { document.body.innerHTML = '<div id="projectAsk">Open this page with <code>facetool gui</code>: it needs the token of the server.</div>'; return; }
  if (!project) {
    // No project yet: only Open and New work
    document.querySelectorAll('main button, main input, main textarea, footer button, footer select, #save, #undo, #redo').forEach(control => { control.disabled = true; });
    note('No design is open. Choose Open or New at the top, or drop a design zip on this page.');
    showOpen();
    return;
  }
  try { const message = sessionStorage.getItem('facetoolNote'); sessionStorage.removeItem('facetoolNote'); if (message) toast(message); } catch (error) { /* no storage */ }
  cover('Starting the engine…', 'Reading ' + project);
  const events = new EventSource('/api/events?token=' + encodeURIComponent(token) + '&project=' + encodeURIComponent(project));
  // The stream broke: ask the server whether it is still there
  events.onerror = () => { fetch('/api/ping', { headers: { 'X-Facetool-Token': token } }).then(response => { if (!response.ok) serverGone(); }, serverGone); };
  events.addEventListener('log', event => { const data = JSON.parse(event.data); logLine(data.line, data.text, data.exitCode); });
  // The folder changed on disk (an agent edited it): show it again and mark the changed layers
  events.addEventListener('changed', () => refresh(true));
  first().then(lint);
}
// The start: the controls stay off until the first picture is there.
async function first() {
  const began = Date.now();
  await loadInfo(); await loadLayers(false); await loadScene();
  cover('Drawing the first picture…', 'The first picture of a design takes a few seconds. The next ones come much faster.');
  await render();
  uncover();
  logLine('(the first picture was there after ' + ((Date.now() - began) / 1000).toFixed(1) + ' s)');
}
start();
</script>
